# Produção (servidor). Variáveis lidas de app/.env:
#   docker-compose --env-file app/.env -f docker_compose.prod.yml up -d --build
# O banco não tem porta publicada; a API só escuta em 127.0.0.1 (o nginx do servidor faz o https).
networks:
  loja-sucos-network:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    container_name: loja-sucos-database
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loja-sucos-network

  flyway:
    image: flyway/flyway:11
    container_name: loja-sucos-flyway
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: public
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./app/migrations/versions:/flyway/sql:ro
    depends_on:
      - db
    networks:
      - loja-sucos-network

  app:
    container_name: loja-sucos-app
    build: .
    restart: always
    env_file:
      - ./app/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PYTHONPATH: /
      TZ: America/Sao_Paulo
    command: ["/app/start_prod.sh"]
    depends_on:
      - db
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - loja-sucos-network
